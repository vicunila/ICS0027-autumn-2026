<!doctype html>
<meta charset="utf-8">
<title>Your files</title>
<h1>Your files</h1>

<form id="upload" method="post" action="{{ url_for('upload') }}" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="file" name="file">
  <button type="submit">Upload</button>
</form>

<ul>
{% for f in files %}
  <li>{{ f['filename'] }} ({{ f['date_added'] }})
    <form method="get" action="{{ url_for('download', file_id=f['file_id']) }}">
      <button type="submit">Download</button>
    </form>
    <form method="post" action="{{ url_for('delete', file_id=f['file_id']) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">Delete</button>
    </form>
  </li>
{% endfor %}
</ul>

<form id="logout" method="post" action="{{ url_for('logout') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button type="submit">Log out</button>
</form>
